services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - litellm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  litellm:
    # 自建镜像与本机运行时同版本（1.91.1）；官方 v1.83 镜像会让计费补丁失效。
    # 国内构建走腾讯云 pip 镜像 + npmmirror prisma 引擎镜像（见 litellm.Dockerfile）。
    build:
      context: ..
      dockerfile: deploy/litellm.Dockerfile
    image: geek-litellm:1.91.1
    ports:
      # 默认仅本机可访问：用户预算在网关上，但 Master Key 不应暴露到公网；
      # 确需对外暴露时设 GATEWAY_BIND=0.0.0.0（并自行加防火墙/反代鉴权）
      - "${GATEWAY_BIND:-127.0.0.1}:4000:4000"
    volumes:
      - ../gateway/config.yaml:/app/config.yaml
      - ../gateway/callbacks.py:/app/callbacks.py
      - ../gateway/deepseek_peak.py:/app/deepseek_peak.py
      - ../gateway/model_catalog.json:/app/model_catalog.json
      # callbacks.py 依赖的兼容补丁（缺一个都会 ImportError 起不来）
      - ../gateway/rerank_compat.py:/app/rerank_compat.py
      - ../gateway/prisma_engine_compat.py:/app/prisma_engine_compat.py
      - ../gateway/usage_breakdown_compat.py:/app/usage_breakdown_compat.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-litellm}@postgres:5432/litellm
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      # ⚠ 生产 NODE_ENV=production 时会话 Cookie 带 Secure：浏览器只在 HTTPS 或
      # 本机 localhost 上发送。用局域网/公网 IP 的 http://…:3000 访问会登不进去
      # （Cookie 不被带上，反复跳登录页）。对外服务必须前置反代终止 HTTPS；
      # 反代与 Web 同机时建议 WEB_BIND=127.0.0.1，不要把 3000 裸暴露到公网。
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      GATEWAY_BASE_URL: http://litellm:4000
      DATABASE_URL: file:/data/dev.db
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ALLOW_TEST_HOOKS: ${ALLOW_TEST_HOOKS:-false}
      # 调试台图片必须落在挂载卷里；/app/data 在镜像层，重建容器即丢
      PLAYGROUND_UPLOAD_ROOT: /data/playground-uploads
    volumes:
      - web_data:/data
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  litellm_pg:
  web_data:
