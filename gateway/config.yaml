  # ---------- 讯飞星火（星辰 MaaS，OpenAI 兼容） ----------
  # 上游限时免费，官方 2026-11-28 下架该模型，到期需同步下线或替换。
  # spark-x2.6-4b：key 无该服务订单（11200），用户已放弃接入，勿再接。
  - model_name: spark-x2.6
    litellm_params:
      model: openai/spark-x2.6
      api_base: https://maas-api.cn-huabei-1.xf-yun.com/v2
