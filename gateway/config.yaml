  # ---------- 阿里云百炼 DashScope（OpenAI 兼容，2026-11-19 接入） ----------
  # 价格来源：help.aliyun.com/zh/model-studio/billing-for-model-studio（华北2原价）
  # 与百炼控制台模型广场截图（2026-11-19 核对）。改价请同步 model_catalog.json 与 model-market.ts。
  - model_name: qwen4-max
    litellm_params:
      model: openai/qwen4-max
      api_base: os.environ/DASHSCOPE_API_BASE
      api_key: os.environ/DASHSCOPE_API_KEY
    model_info:
