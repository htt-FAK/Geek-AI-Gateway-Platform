litellm_settings:
  drop_params: true
  include_cost_in_streaming_usage: true
  callbacks:
    - callbacks.deepseek_peak_pricing_logger

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
